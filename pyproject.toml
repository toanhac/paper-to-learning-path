[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "paper-to-learning-path"
version = "2.1.1"
description = "AI agent skill: convert research PDFs into translated HTML + prerequisite learning path"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["ai", "agent", "skill", "pdf", "translation", "learning-path", "research-paper"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pymupdf>=1.23.0",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
cli-gemini = ["google-generativeai>=0.7.0"]
cli-openai = ["openai>=1.0.0"]
cli-google = ["deep-translator>=1.11.0"]
cli-all = ["google-generativeai>=0.7.0", "openai>=1.0.0", "deep-translator>=1.11.0"]

[project.urls]
Homepage = "https://github.com/ToanHac/paper-to-learning-path"
Issues = "https://github.com/ToanHac/paper-to-learning-path/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py39"]
